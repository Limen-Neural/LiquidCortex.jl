name: Sentry Preflight

on:
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: sentry-preflight-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify Sentry configuration
    # Secrets are unavailable on fork PRs; skip rather than hard-fail external contributors.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: limen-neural
      SENTRY_PROJECT: liquidcortex

    steps:
      - name: Check Sentry configuration
        if: ${{ env.SENTRY_AUTH_TOKEN == '' }}
        run: |
          echo "⚠ Missing required secret: SENTRY_AUTH_TOKEN"
          echo "Add SENTRY_AUTH_TOKEN to the GitHub Actions secrets for this repository."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install pinned sentry-cli
        env:
          SENTRY_CLI_VERSION: "3.4.0"
        run: |
          set -euo pipefail
          asset_name="sentry-cli-Linux-x86_64"
          asset_url="https://downloads.sentry-cdn.com/sentry-cli/${SENTRY_CLI_VERSION}/${asset_name}"
          expected_sha256="803556dd09de4fe54639c4d2e696315fd5a67dda3f8fe8dfe52a942ead5a2ae1"
          curl -fsSL "$asset_url" -o sentry-cli
          echo "${expected_sha256}  sentry-cli" | sha256sum -c -
          chmod +x sentry-cli
          sudo mv sentry-cli /usr/local/bin/sentry-cli
          sentry-cli --version

      - name: Verify Sentry authentication
        run: |
          echo "Verifying Sentry authentication for org: ${SENTRY_ORG}"
          sentry-cli info

      - name: Verify Sentry project exists
        run: |
          set -euo pipefail
          echo "Verifying Sentry project: ${SENTRY_ORG}/${SENTRY_PROJECT}"
          # sentry-cli 3.4.0 has no --limit; capture full output so exit code is preserved
          # (and SIGPIPE from `head` cannot mask success/failure).
          out="$(sentry-cli releases list -p "${SENTRY_PROJECT}" 2>&1)" || {
            echo "$out"
            exit 1
          }
          echo "$out" | head -5
