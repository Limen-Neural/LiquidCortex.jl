---
# Codacy configuration for LiquidCortex.jl

# Exclude agent guidance files (not source code)
exclude_paths:
  - AGENTS.md
  - REVIEW.md

engines:
  markdownlint:
    enabled: true
    config:
      # Markdown is pure — no inline HTML used
      MD033:
        enabled: false
      # First line is the title heading, badges follow
      MD041:
        enabled: false
