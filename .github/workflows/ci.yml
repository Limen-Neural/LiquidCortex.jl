name: CI (Julia)

on:
  push:
    branches:
      - main
      - 'release/*'
  pull_request:
    branches:
      - '**'

concurrency:
  group: ci-julia-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Julia ${{ matrix.julia-version }} — CPU smoke tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.10', '1.11', '1.12']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2

      - name: Instantiate
        run: julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'

      - name: Run tests with coverage
        run: julia --project=. -e 'using Pkg; Pkg.test(; coverage=true)'

      - name: Generate coverage report
        run: julia --project=. -e '
          using Coverage;
          cov = process_folder();
          LCOV.writefile("lcov.info", cov);
          println("Coverage: $(get_summary(cov))%")'

      - name: Upload coverage to Codecov
        if: matrix.julia-version == '1.11'
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          flags: Julia${{ matrix.julia-version }}
          name: Julia ${{ matrix.julia-version }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Run doctests (if any)
        run: julia --project=. -e 'using Pkg; Pkg.test(; test_args=["doctest"])'
        continue-on-error: true
